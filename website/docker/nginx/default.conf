map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  root /var/www/backend/public;
  index index.php;

  # Security hardening headers (apply to front-controller responses).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Static character images (Melee character renders)
  location ^~ /characters/ {
    alias /var/www/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Vite-built assets (hashed filenames → long-lived cache)
  location ^~ /build/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Vite dev server HMR websocket + module requests (development only)
  location ^~ /@vite/ {
    proxy_pass http://host.docker.internal:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }

  location ^~ /@fs/ {
    proxy_pass http://host.docker.internal:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }

  # PWA service worker: served from the web root so its scope covers the whole
  # site, and never cached so a changed worker is picked up immediately.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Offline fallback and install manifest (nginx has no .webmanifest mime type).
  location ~* ^/(offline\.html|site\.webmanifest)$ {
    # A local types block replaces the inherited map, so html is repeated here.
    types { text/html html; application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Protected admin page (basic auth, served by Symfony/Inertia)
  location = /admin {
    auth_basic "Restricted admin";
    auth_basic_user_file /etc/nginx/.htpasswd;
    try_files $uri /index.php$is_args$args;
  }

  # Protected start.gg admin/data endpoints (same basic auth as /admin).
  # OAuth connect/callback stay public so the login redirect flow works.
  location ~ ^/api/startgg/(status|disconnect|cache/flush|tournament|turner-tuesday)(/|$) {
    auth_basic "Restricted approval";
    auth_basic_user_file /etc/nginx/.htpasswd;
    try_files $uri /index.php$is_args$args;
  }

  # All other requests → Symfony (Inertia pages + API)
  location / {
    try_files $uri /index.php$is_args$args;
  }

  location ~ ^/index\.php(/|$) {
    fastcgi_pass php:9000;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $document_root;
    internal;
  }

  location ~ \.php$ {
    return 404;
  }

  error_log /var/log/nginx/error.log warn;
  access_log /var/log/nginx/access.log;
}
