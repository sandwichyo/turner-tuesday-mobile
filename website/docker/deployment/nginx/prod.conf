server {
  listen 80;
  server_name _;

  root /var/www/backend/public;

  # Security hardening headers (apply to front-controller responses).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # HSTS: lasting https commitment for melee.sandwichyo.com — remove if the
  # domain must ever be reachable over plain http.
  add_header Strict-Transport-Security "max-age=15768000" always;

  # Character images (baked into nginx image at public/characters/)
  location ^~ /characters/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Vite-built assets (hashed filenames → immutable cache)
  location ^~ /build/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Web-root static files (favicons, robots) — baked into the nginx image,
  # served directly so the unconditional fastcgi_pass in `location /` below
  # does not swallow them.
  location ~* ^/(favicon\.ico|favicon\.svg|favicon-96x96\.png|apple-touch-icon\.png|web-app-manifest-192x192\.png|web-app-manifest-512x512\.png|robots\.txt)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # PWA service worker: must sit at the web root so its scope covers the whole
  # site, and must never be cached — a stale worker would keep serving the old
  # caching rules (and the old push handler) after a deploy.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Offline fallback and install manifest: short cache so changes roll out.
  location ~* ^/(offline\.html|site\.webmanifest)$ {
    # A local types block replaces the inherited map, so html is repeated here.
    types { text/html html; application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Protected admin page (basic auth)
  location = /admin {
    auth_basic "Restricted admin";
    auth_basic_user_file /etc/nginx/.htpasswd;
    include fastcgi_params;
    fastcgi_pass melee-php:9000;
    fastcgi_read_timeout 120;
    fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
  }

  # Protected start.gg admin/data endpoints (same basic auth as /admin).
  # OAuth connect/callback stay public so the login redirect flow works.
  location ~ ^/api/startgg/(status|disconnect|cache/flush|tournament|turner-tuesday)(/|$) {
    auth_basic "Restricted approval";
    auth_basic_user_file /etc/nginx/.htpasswd;
    include fastcgi_params;
    fastcgi_pass melee-php:9000;
    fastcgi_read_timeout 120;
    fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
  }

  # Block direct PHP file access
  location ~ \.php$ {
    return 404;
  }

  # All other requests → Symfony front controller
  # Direct FastCGI call: production nginx has no index.php, so try_files
  # would find the public/ directory and return 404 instead of falling back.
  location / {
    include fastcgi_params;
    fastcgi_pass melee-php:9000;
    fastcgi_read_timeout 120;
    fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
  }

  error_log /var/log/nginx/error.log warn;
  access_log /var/log/nginx/access.log;
}
